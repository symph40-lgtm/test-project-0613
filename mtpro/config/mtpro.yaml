# MT-PRO 상수 (사전 등록 — 측정 후 변경 금지, 변경은 amendment로만). WORKORDER_MTPRO_v10.1 + T1 부록 C + 발주자 8/17.
version: t2-2026-08-17

scopes: [KOSPI200, "005930", "000660"]        # SOXX는 원형(release_time) 경로 이벤트 전용

grade_a_events:                                # 7종 확정 (금통위 제외), 전부 자동 수집
  - FOMC
  - US_CPI
  - US_NFP
  - US_PCE
  - SEC_PRELIM
  - HYNIX_EARN
  - NVDA_EARN

t0:
  domestic_mode: A1_open                       # 국내 자산 부품 3 = A-1 단일 (t0=09:00 시가, 갭 제외, t6 없음)
  soxx_mode: release_time                      # 원형 경로는 SOXX 이벤트에서만
  a1_timepoints: {t1: "09:05", t3: "09:30", t4: "14:30", t5: close}   # t2 = peak adverse(시가 대비)

consensus:
  collect_days_before: [3, 1]                  # D-3, D-1 2회 수집
  freeze_at_days_before: 1                     # D-1 값 자동 동결
  single_fetch_allowed: true                   # ① FF 1주 한계 → D-1 단독 허용, single_fetch=true 기록
  manual_override_wins: true                   # AM-4 역방향: 수동 입력이 자동을 이김(자동 D-1은 기록만)
  unconfirmed_recheck_days_before: 7           # ⑤ 미확인 일정 D-7 재확인 알림
  on_collect_fail: loud_failure_then_manual    # 실패 → 알림 → 수동 1건 or 등급C 격하
  frozen_update: reject                        # hard assert
  fields:                                      # ② 사전 등록
    US_CPI: headline_mom
    US_PCE: core_mom
    FOMC: rate_upper_bound
    US_NFP: headline_change
  alerts: [alerts_jsonl, stderr]               # ④ 문자 연동은 T6 직전 재결정

flow:                                          # 부품 4 (T1-1 승인 제안)
  index_unit: KOSPI_MARKET                     # 시장 전체 투자자별 순매수
  reconcile:                                   # C-1: 교체 대상·시점 고정, 재론 금지
    alternative: PIT_CONSTITUENT_SUM
    when: T3_once
    window: [2023-01-03, 2026-06-30]
    metric: pearson_daily_net_purchase        # 외국인·기관 각각
    replace_if_below: 0.8
  reconcile_result:                            # C-1 판정 기록 (T3 1회, 재론 금지)
    corr_foreign: 0.9967
    corr_institution: 0.9973
    sign_agree_foreign: 0.9576
    sign_agree_institution: 0.9659
    n_days: 850
    decision: KOSPI_MARKET
    decided_on: 2026-08-17
  denominator: trading_value_mean20            # 비수정 OHLCV 거래대금 (price_adjusted=false)
  denominator_aux: market_cap
  constants:                                   # D-D 승인 (사전 등록값 = 모듈 상수)
    mean_tv_days: 20
    beta_window_days: 120
    beta_min_obs: 60
    resid_z_window_days: 120
    resid_z_min_obs: 60
    trend_days: 5
    trend_ref_window_days: 120                 # 당일 제외 직전 120일
    trend_ref_min_obs: 60
    beta_extreme_abs: 1.0

breadth:                                       # 부품 5 (T1-2 승인 제안)
  constituents_pit: monthly_first_trading_day  # asof 기록
  tiers: {large: [1, 50], mid: [51, 150], small: [151, 200]}   # KOSPI200 내 시총 순위
  tier_overflow: {method: rank_last_tier, periods: ["2024-10", "2024-11", "2024-12"], n: 201}   # D-C 승인: 초과 순위 → small(151~끝)
  lookback_start: 2022-01-03                   # 252일 신고저용 → 지표는 2023-01-03부터
  constants:                                   # D-D 승인: 승격 시점 값 = 사전 등록값 (모듈 상수와 일치 테스트)
    ma_short_days: 20
    ma_long_days: 60
    high_low_window_days: 252
    impulse_recent_days: 5
    impulse_prior_days: 15
    impulse_z_window_days: 120                 # 당일 제외 직전 120일 (AM-2 취지)
    impulse_z_min_samples: 60
    leadership_large_only: {large_gt: 0.40, mid_lt: 0.25}
    leadership_broad: {large_gt: 0.30, mid_gt: 0.30}

energy_lite:                                   # D-B 승인(2026-08-17): 균등 가중·가용 평균·min 2 사전 등록 고정, 측정 후 변경 금지
  weights: {flow: 0.3333, breadth: 0.3333, gradec_err: 0.3334}   # 무정보 균등 (확정)
  min_components: 2                            # Lite 전용 예외 (A-6 각주 — 완전판 Energy는 3 유지)
  gradec_err_definition: mean_of_available_good_bad_z             # 둘 다 None → None (확정)
  z_window_days: 120                           # 컴포넌트 z 표준화 창(과거만)
  scopes: [KOSPI200, "005930", "000660"]

grade_c:                                       # 소급 트랙 등급C 재료 (T1-3: 전일밤 ^SOX 부호·크기)
  proxy: SOX_prev_night_return
  beta_window_days: 60                         # β_SOX 롤링 회귀 창, 절단 [0.3, 3.0]
  min_justified_abs_pct: 0.3                   # |정당화 반응| < 0.3% 는 재료 없는 날 → 제외(None)
  err_z_window_days: 120
  reaction_basis: open_to_close                # D-A 승인: A-1 갭 제외 유지. 실측 β_SOX≈0 → gradec_err는 사실상 "이벤트일 표준화 수익률"(T4 사전 등록 명시)
  reused_session_policy: none                  # D-E 승인: 미국 휴장으로 같은 세션 재사용 → None
  r2_watch: beta_sox_recovery_gradeA           # 등급A 전진 트랙에서 β 회복 여부 = R2 관찰 항목
  constants:                                   # D-D 승인 (GradeCParams 사전 등록값)
    beta_min_samples: 40
    beta_clip: [0.3, 3.0]
    expected_std_floor: 0.1
    expected_std_min_samples: 20
    asym_window_days: 20
    asym_min_n: 2
    asym_halflife: 15.0
    gb_beta_clip: [0.3, 2.0]
    gb_beta_min_n: 3
    max_stale_calendar_days: 7

events:                                        # T5-1 이벤트 독립성·purge (AM-9; 계획서 §2.2·§12.5 승인 사전 등록, 모듈 상수와 일치 테스트)
  independence:
    w_digest: 5                                # 소화 창 W_digest = 5 KR 거래일 (t0_kr 포함) → digest_window_end = t0_kr + 4 세션
    earnings_cluster_sessions: 3               # 실적 3종(SEC_PRELIM·HYNIX_EARN·NVDA_EARN) 서로 [t0_kr ± 3 거래일] → EARNINGS_CLUSTER
    earnings_types: [SEC_PRELIM, HYNIX_EARN, NVDA_EARN]
    calendar: XKRX                             # exchange_calendars XKRX champion, 폴백 = bronze ohlcv_adj 관측 거래일 + notify(XKRX_FALLBACK)
    boundary: "release < 09:00 KST → same session"   # t0_kr 경계 고정 (정확히 09:00 이후는 다음 세션)
    surprise_z_good: 0.3                       # good e* = surprise_z > +0.3 / bad e* = surprise_z < −0.3 / 그 외 neutral(라벨 불가)
    surprise_z_bad: -0.3
    challengers: [IND-C1, IND-C2]              # W_digest=3 / 유형별 창(FOMC 7·CPI/NFP/PCE 3·실적 5) — shadow 전용, T5-1 미구현

semi_diffusion:                                # T5-4 부품 5 diffusion 축 (계획서 §3.3 semi_diffusion_z · §12.4; AM-8 정의 구분 — diffusion = 반도체 종목군 내 확산)
  source:                                      # 반도체 종목군 = KOSPI200 PIT 구성 ∩ KRX 지수 PDF(월초 asof, PIT). 목록 자체는 silver/semi_group_monthly.parquet(데이터)로 관리
    method: pykrx_index_pdf_union              # 8/17 실측: pykrx KOSPI 업종지수(1001~1047)에 "반도체" 없음(전기전자 1013 뿐) → KRX 지수 2종 합집합
    index_codes: ["5044", "5422"]              # 5044 KRX 반도체(삼성전자 2023-09 정기변경 전 미편입) ∪ 5422 KRX 반도체 Top 15(삼성전자 전 구간) — 합집합 ∩ K200 = 5422 ∩ K200 과 동일(실측)
    survivorship_bias: false                   # 월초 asof PIT 조달 (현재 리스트 소급 아님)
    fallback: naver_wics_current_list          # PDF 실패 시 네이버 WICS 반도체와반도체장비 현재 리스트(생존 편향 true 명시) — 8/17 미사용
  leaders: ["005930", "000660"]                # 진단 leader_gap = mean(leaders above20) − rest_of_semi
  constants:                                   # 모듈 상수와 일치 테스트 (tests/test_semi_diffusion.py)
    spread_change_days: 5                      # diffusion_spread 5일 변화
    z_window_days: 120                         # t−1 까지 직전 120 거래일 (당일 제외)
    z_min_samples: 60                          # 표본 < 60 → None
    impulse: breadth_same                      # semi_impulse = 부품 5 impulse 정의(최근 5 − 이전 15) 재사용

us_assets:                                     # T5-2 부품 10 재료 (계획서 §3.4·§12.3): 미국 4자산 일봉 적재
  tickers: [SOXX, NVDA, MU, TSM]
  start: 2022-06-01                            # 2023-01 지표용 lookback (z 120 + 직교화 120)
  source: yfinance_auto_adjust
  path: data/bronze/us_daily.parquet
  align: prev_us_session_strict                # 국내 t ← 세션 d ≤ t−1 엄격, 미국 휴장 재사용 → None (grade_c 정렬기 재사용)
  sox_daily_unchanged: true                    # ^SOX(bronze/sox_daily) 등급C 재료는 그대로

gap3g:                                         # T5-2 부품 3G — Gap Reaction / Gap Hold / Close Acceptance (계획서 §1 A-1R·§3.2·§7)
  time_axis: A-1R                              # 마감 후 상태 산출에 갭 사용 허용. 사전 예측 입력 금지 유지. gradec_panel(A-1) 불변
  t0_mode: A1_open                             # C-3 값 불변 (§7)
  expected_gap_sources: [gradeC, gradeA]       # gradeA 는 T5-6 Expected Reaction 이 채우는 인터페이스
  scopes: [KOSPI200, "005930", "000660"]
  constants:                                   # 사전 등록값 = Gap3GParams (일치 테스트)
    min_gap_abs_pct: 0.3                       # |gap| < 0.3% → gap_hold None
    gap_hold_clip: [-1.0, 2.0]
    z_window_days: 120                         # §12.4: t−1까지 120 국내 거래일, 표본<60 None, 클립 ±3
    z_min_samples: 60
    z_clip_abs: 3.0
    beta_gap_window_days: 60                   # 등급C β 갭 기준 재추정 (grade_c 와 동일 상수)
    beta_gap_min_samples: 40
    beta_gap_clip: [0.3, 3.0]
    min_expected_gap_abs_pct: 0.3              # |expected_gap| < 0.3% → 재료 없는 날 → ERR None
    sigma_gap_window_days: 120                 # 잔차 rolling std (t−1까지, expected_std_rolling 재사용)
    sigma_gap_min_samples: 60                  # 해석 기록: §12.4 표본 규칙을 σ_gap 에도 적용(가장 엄격)
    sigma_gap_floor: 0.1                       # A-1 유일 상수 (%)
    max_stale_calendar_days: 7

transmission:                                  # T5-2 부품 10 Semi Transmission (계획서 §3.4 + §12.3 champion 방법 A)
  method: A                                    # SOXX 기준선 + NVDA/MU/TSM 잔차 충격 **하나의** 다변량 OLS. raw 4변수 동시 OLS 금지
  design_columns: [z_soxx, resid_nvda, resid_mu, resid_tsm]
  reaction_basis: close_to_close               # A-1R
  scopes_component: ["005930", "000660"]       # Reaction family 입력
  scopes_diagnostic: [KOSPI200]                # 지수 수익률로 동일 산출(진단)
  challengers: [TR-B]                          # 단변량 β 4개 + 사전 정의 combiner(.4/.2/.2/.2) — shadow 전용, 미구현
  constants:                                   # 사전 등록값 = TransmissionParams (일치 테스트)
    z_window_days: 120                         # z_j (t−1까지)
    z_min_samples: 60
    z_clip_abs: 3.0
    orth_window_days: 120                      # 1단계 b_j OLS (t−1까지)
    orth_min_samples: 60
    beta_window_days: 60                       # 2단계 다변량 OLS 창 [t−59, t]
    beta_min_samples: 40
    asym_min_samples: 25                       # β_up/β_down 각 표본 하한
    change_days: 20                            # β(t) − β(t−20)
    change_z_window_days: 120                  # Δβ 분포 z (t−1까지)
    change_z_min_samples: 60
    max_stale_calendar_days: 7

kis:
  minute_depth_days_measured: 365             # 8/17 실측: 2025-08-14 응답·2025-07-11 무응답 → ≈12개월
  token_cache: .cache/kis_token.json           # mtpro 내부 전용

psa:                                           # T5-3 부품 9 PSA (AM-7; 계획서 §4·§12.4·§7 승인 사전 등록, 모듈 상수와 일치 테스트 tests/test_psa.py)
  scopes: [KOSPI200, "005930", "000660"]
  sessions: bronze_ohlcv_adj_order             # 관찰창·σ창의 "세션" = 스코프별 bronze 거래일 순서 (해석 기록: XKRX 래퍼 미사용, T5-3 보고서)
  constants:                                   # = psa.py 모듈 상수 (측정 후 변경 금지, 변경은 amendment)
    k_sigma: 2.5                               # |r_t| > 2.5·σ20
    k_gap: 2.0                                 # |gap_t| > 2.0·σ20_gap
    sigma_window_days: 20                      # σ20 = std(r_{t−20..t−1}) — 충격일 t 제외 (§12.4)
    sigma_min_samples: 20                      # 유효 표본 < 20 → None
    window_sessions: 5                         # 관찰창 t+1..t+5, available_at = t+5 마감
    settle_sessions: 3                         # range_norm/vol_norm 분자 = t+3..t+5 (창의 마지막 3세션)
    level_hold_clip: [-1.0, 1.5]
    z_ref_window_days: 120                     # z 기준 = 같은 스코프 과거 final 충격(available_at ≤ t−1, shock_date ∈ 직전 120 세션)
    z_ref_min_samples: 10                      # 표본 < 10 → None
    z_clip: 3.0                                # §3 공통 규정
    ewma_halflife_days: 10                     # psa_state_at EWMA 반감기(세션) + freshness = 0.5^(d/10)
  challengers:                                 # shadow 전용 (gold/challengers/psa_*.parquet), champion 교체 불가
    PSA-EARLY: {window_sessions: 3}            # t+3 부분 관찰 (정착 = t+1..t+3)
    PSA-K2: {k_sigma: 2.0}
    PSA-W7: {window_sessions: 7}

energy_family:                                 # T5-5 primitive 3-family 결합 Energy (계획서 §3.1~3.5 + §12.2 cap; 모듈 상수 = src/mtpro/state/{families,energy}.py, 일치 테스트 tests/test_state_lookahead.py::test_config_constants_match_modules)
  weights: {R: 0.40, PA: 0.35, P: 0.25}        # 사전 등록(발주서 §0-3 "핵심 측정 = 반응"), 가용 family 로 재정규화
  min_families: 2                              # 미달 → Energy None
  cap_share: 0.6                               # 절대 기여 share 상한 (§12.2)
  cap_factor: 1.5                              # cap 값 = sign·1.5·Σ_others|c| (share 정확히 0.6)
  cap_eps: 1.0e-9                              # Σ_others|c| < eps → cap 미적용·cap_undefined
  min_avail: {R: 1, PA: 2, P: 2}               # family 최소 가용 컴포넌트
  components:
    R: [err_signed_ewma, beta_asym_z, transmission_asym_z]
    PA: [shock_absorption_z, gap_hold_z, close_acceptance_z, psa_z]   # shock_absorption_z = 부품 3 장중(T5-6) 예약·None
    P: [flow_impact_residual_z, breadth_impulse_z, semi_diffusion_z]
  transmission_component_scopes: ["005930", "000660"]   # = transmission.scopes_component (KOSPI200 은 진단 전용 → family 입력 아님)
  constants:
    z_clip_abs: 3.0                            # 컴포넌트 클립 ±3 (§3 공통)
    z_window_days: 120                         # beta_asym z 창 (t−1까지)
    z_min_samples: 60
    ewma_halflife_sessions: 10                 # 이벤트 기반 값 EWMA 반감기(세션)
    freshness_halflife_sessions: 10            # freshness = 0.5^(d/10)
    obs_window_sessions: 120                   # EWMA 관측 창(세션) — 창 밖 가중 ≤ 0.5^12
    beta_asym_window_sessions: 20              # GoodBeta/BadBeta 창 (= grade_c.asym_window_days), 갭 기준 재추정
    beta_asym_min_n: 3                         # = grade_c.gb_beta_min_n
    beta_asym_clip: [0.3, 2.0]                 # = grade_c.gb_beta_clip
  err_sign_convention: return_space            # 해석 기록: gap3g err_z(수익률 공간 잔차) 그대로 = "양 = 우호"(호재 초과 상승·악재 버팀). 재료 방향 공간값은 err_surprise_space 열 병기
  challengers: [E-ORTH, E-EQ, E-NOCAP]         # shadow 전용 gold/challengers/energy_*.parquet
  orth_order: [R, P, PA]                       # E-ORTH Gram–Schmidt 순서

upper_state:                                   # T5-5 상위 상태 Good Acceptance / Bad Resilience (계획서 §5, 출력 전용 — Energy 입력 아님; 모듈 = src/mtpro/state/upper_state.py)
  n_evidence: 6
  min_evidence: 2                              # 가용 < 2 → None + "insufficient" (state_confidence 는 산출)
  good_evidence: [good_err, good_beta, good_shock, good_gap, good_psa, good_flow]
  bad_evidence: [bad_err, bad_beta, bad_shock, bad_gap, bad_psa, bad_flow]
  reserved_evidence: [good_shock, bad_shock]   # 부품 3 장중 shock_absorption (T5-6) 예약
  beta_neutral: 1.0                            # z(GoodBeta − 1) = (β−1)/std_past120 (해석 기록: 표준 z 는 −1 소거 → 중립 1 중심)
  ewma_halflife_sessions: 10
  obs_window_sessions: 120                     # evidence_n 집계 창
  confidence_formula: "round(100 * n_avail/6 * (0.5 + 0.5*agreement) * freshness)"

outputs:                                       # T5-5 ΔMT · Divergence · Regime · 텍스트 (계획서 §6·§12.4; 모듈 = src/mtpro/state/outputs.py)
  delta: {recent: 5, hist_window: 60, scale: 20.0, min_changes: 5}   # = errata.delta_from_history 기본값(AM-2)
  delta_challengers: [DMT-C1, DMT-C2]          # EMA3−EMA10 / 3일 기울기
  divergence:
    slope_days: 20                             # z_slope20(Energy) − z_slope20(ln close)
    z_window_days: 120                         # 자기 과거 기울기 분포 (t−1까지)
    z_min_samples: 60
    label_threshold: 1.0                       # div ≥ +1 ∧ 가격 z < 0 → positive / ≤ −1 ∧ 가격 z > 0 → negative
    self_reference: forbidden                  # Regime·Energy 함수 시그니처에 div 인자 없음 (테스트)
    challengers: [DIV-C1, DIV-C2, DIV-C3, DIV-C4]   # 10일 / 레벨 z(E20평균)−z(r20) / z 창 60 / z 창 252
  regime:
    ema_span: 20                               # EMA20(Energy), None 일 건너뜀
    ema_min_obs: 20                            # 유효 관측 20 미만 None (Regime 시작 = EMA 정의 첫날)
    margin: 0.15                               # A-3 전환 임계
    required_days: 2                           # A-3 연속 일수
    breadth_level_source: "breadth_panel.above_20d_ratio -> z(120, min 60, clip 3)"   # 해석 기록: 원값 [0,1] 은 A-2 `breadth>0` 판정 무의미 → z
    inputs: [energy_ema20, delta_mt, bad_resilience, breadth_level_z]   # = errata.classify_regime 시그니처 (Good Acceptance·Divergence 없음)
  text:
    template: "{Regime} 유지 ({p:.0%})[ / 그러나 {근거들} — {해석}]"
    delta_threshold: 15.0                      # ΔMT 반대 신호 임계 (A-2 thaw/cooling 규칙과 동일)
    state_threshold: 50.0                      # Good/Bad 상태 반대 신호 임계 (§6 예시 "Bad Resilience ≥ +50")
    regime_polarity: {winter: -1, cooling: -1, thaw: 1, spring: 1}

expected_reaction:                             # T5-6 등급A Expected Reaction (계획서 §3.1 ERR_signed·§2.2 검증 라벨·§12.4; WORKORDER 종목 독립) — 모듈 상수와 일치 테스트 tests/test_expected_reaction.py
  scopes: [KOSPI200, "005930", "000660"]
  independence: per_scope                      # 스코프별 독립 추정, pooling 금지. hierarchical shrinkage 는 challenger SHRINK-H(등록만, 미구현)
  reaction: gap_reaction                       # A-1R Gap Reaction = gold/gap3g_panel.gap_pct (t0_kr, scope). 장중 5점 ERR 은 challenger ERR-INTRADAY
  features: [surprise_z, vix_z, sox_shift_z, rate_change_bp]
  feature_sources: {vix: "yfinance:^VIX close", sox: "bronze/sox_daily ret_pct (gradec.align_prev_us_session, d ≤ t0_kr−1)", tnx: "yfinance:^TNX close ×100 bp"}
  macro_path: data/bronze/macro_daily.parquet
  available_at: t0_kr_close_1530_KST           # A-1R: 마감 후 상태 산출에만 사용
  challengers: [SHRINK-H]
  constants:                                   # = ExpectedReactionParams (측정 후 변경 금지, 변경은 amendment)
    surprise_std_window: 20                    # 유형별 과거 서프라이즈 rolling std (정오표 A-1 expected_std_rolling 재사용, floor 0 → std 0 None)
    surprise_std_min_samples: 3
    implicit_max_delta_surprise_z: 0.8         # 동일 event_type · |Δsurprise_z| < 0.8
    implicit_recent_n: 5                       # 최근 5건
    implicit_halflife_days: 30.0               # EWMA 반감기 30 — 해석 기록: 달력일 age (이벤트 건수 아님)
    implicit_min_samples: 3                    # 표본 < 3 → None
    explicit_recent_n: 120                     # 최근 120건 OLS (gap ~ 1 + 4피처)
    explicit_min_samples: 20                   # 표본 < 20 → None
    explicit_r2_recent_n: 30                   # 최근 30건 R² (β_recent 모형 적용)
    explicit_r2_threshold: 0.3
    alpha_informative: 0.5                     # R² > 0.3 → α 0.5   (α = 전 이력 OLS 쪽 가중: β = (1−α)β_recent + α·β_full — 해석 기록)
    alpha_default: 0.8
    q_high: 0.85                               # q > 0.85 → 0.7E + 0.3I
    q_mid: 0.7                                 # q > 0.7  → 0.5/0.5, 그 외 0.2E + 0.8I
    weights_high: [0.7, 0.3]                   # (explicit, implicit)
    weights_mid: [0.5, 0.5]
    weights_low: [0.2, 0.8]
    expected_std_window: 20                    # 정오표 A-1 유형별 rolling std (같은 scope 잔차)
    expected_std_floor: 0.1                    # %
    expected_std_min_samples: 3
    feature_z_window_days: 120                 # §12.4 (세션 d−1 까지)
    feature_z_min_samples: 60
    feature_z_clip_abs: 3.0
    rate_change_sessions: 5                    # ^TNX 5세션 변화
    max_stale_calendar_days: 7

intraday:                                      # T5-6 부품 3 장중 6점 (A-1 유지: t0=09:00 시가 앵커, t6 없음) + KIS 분봉 축적기
  minute_store:
    path: data/bronze/minute/{code}/{YYYY-MM-DD}.parquet   # schema.BRONZE_MINUTE (price_adjusted=False, market_div J)
    codes: ["005930", "000660"]                # KOSPI200 지수 분봉은 TR 이 다름(FHKUP03500200 inquire-time-indexchartprice) → 이번 범위 제외·기록
    excluded: {KOSPI200: "index minute TR differs (FHKUP03500200); out of T5-6 scope — 발주자 확인 사항"}
    tr_id: FHKST03010230                       # kis/minute.py (60분 앵커 7호출/일, 호출 간 0.15초)
    depth_days: 365                            # kis.minute_depth_days_measured (T2 실측 ≈12개월)
    calendar: XKRX                             # 결측일 = XKRX 세션 − 적재일 → alerts.loud_failure(MINUTE_GAP)
    complete_after_kst: "15:40"                # 당일은 이 시각 이후에만 완결 적재
    min_bars_full_day: 300                     # 이 미만이면 partial 표기(정규장 381봉; 첫 거래일·수능일 10:00 개장 = 331)
    empty_retry_max: 3                         # KIS 무응답 세션 재시도 상한(초과 시 gap 으로 확정 기록)
    depth_stop_consecutive_empty: 3            # 소급 적재 시 연속 무응답 3세션 → 이력 창 경계로 판단·중단
  absorption:                                  # components/absorption.py (AbsorptionParams 일치 테스트 tests/test_absorption.py)
    scopes: ["005930", "000660"]
    timepoints: {t0: "09:00 open", t1: "09:05", t2: "peak in material direction (호재 max high / 악재 min low, 시가 대비)", t3: "09:30", t4: "14:30", t5: close}
    price_at_rule: close_of_last_bar_before    # HH:MM 시점 가격 = 시작시각 < HH:MM 인 마지막 완성봉 종가 (봉 시각 = 봉 시작)
    direction_source: [gradeA_surprise_sign, gradeC_sox_sign]   # 등급A(expected_reaction_events direction) 우선, 없으면 gap3g sox_ret_prev 부호
    absorption_ratio: {bad: "1 − |t5|/|t2|", good: "t5/t2", t2_zero: None}
    half_life: minutes_from_peak_until_half_retrace           # 진단 전용(z 없음)
    close_acceptance: not_here                 # 3G CLV 와 중복 → 산출 안 함
    constants:
      t1: "09:05"
      t3: "09:30"
      t4: "14:30"
      z_window_days: 120                       # shock_absorption_z: t−1 까지 120 세션(스코프별), 표본<60 None, 클립 ±3
      z_min_samples: 60
      z_clip_abs: 3.0
      min_bars: 300                            # 세션 봉 수 < 300 → 6점 산출 안 함(partial)
      max_price_gap_minutes: 5                 # 시점 봉 결측 시 5분 이내 직전 봉 허용

live:                                          # T5-6 홈PC 라이브 크론 (jobs/live_daily.py, docs/mtpro-live-ops.md)
  schedule_kst: "16:10 weekdays"               # 평일 16:10 KST (KRX 마감 15:30 + pykrx 반영 여유)
