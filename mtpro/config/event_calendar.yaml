# MT-PRO 등급A 이벤트 캘린더 (WORKORDER v10.1 T1-3, 발주자 개정 D3 2026-08-17: 7종 확정, 금통위 제외)
#
# 규칙
# - 이 파일이 "공식 일정" 등록부다. 자동 크롤하지 않는다(T1 보고 T1-3). 연 1회 갱신 + 변경 시 amendment.
# - event_id = {event_type}_{YYYYMMDD} (현지 발표일 기준).
# - status: confirmed = 공식 소스(또는 그 사본)에서 날짜를 읽어 확인 / unconfirmed = 미확인(과거 패턴 추정, 발표 전 반드시 확정 후 갱신)
#           / tentative = 공식 일정 자체가 미게시인 예시 날짜 (T5-1, 계획서 §12.5: 공고 확인 전 verify_eligible=False, D-7 재확인 알림 대상).
#   unconfirmed·tentative 이벤트는 스케줄러가 대상 선별은 하되 alert(kind=UNCONFIRMED_SCHEDULE) 를 남긴다.
# - consensus_field: 미 매크로 4종은 config/mtpro.yaml consensus.fields(운영 결정 ②) 와 동일한 코드값을 쓴다 (test_calendar 로 고정).
# - t0_mode: 국내 자산 이벤트 전부 A1_open (부록 C-3). release_time 은 장중 발표 이벤트 전용(현재 7종엔 없음).
# - 시각은 현지 시간(local_time + tz). UTC 변환은 calendar.py 가 zoneinfo 로 수행(DST 자동).
version: "2026-08-17"

event_types:
  FOMC:
    label: "FOMC 성명(금리 결정)"
    official_source: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
    release_rule: "회의 2일차 14:00 America/New_York (KST 익일 03:00/04:00) — KRX 휴장 시간"
    tz: "America/New_York"
    local_time: "14:00"
    t0_mode: "A1_open"
    asset_scope: ["KOSPI200", "005930", "000660"]
    consensus_source: "us_macro"     # investing.com / ForexFactory (collectors/us_macro.py, 실측 결과는 보고서 참조)
    consensus_field: "rate_upper_bound"   # ② 사전 등록(config/mtpro.yaml consensus.fields) — FF 제목 "Federal Funds Rate" (target upper bound)
    consensus_unit: "%"
  US_CPI:
    label: "미 CPI"
    official_source: "https://www.bls.gov/schedule/news_release/cpi.htm"
    release_rule: "08:30 America/New_York (KST 21:30/22:30) — KRX 휴장 시간"
    tz: "America/New_York"
    local_time: "08:30"
    t0_mode: "A1_open"
    asset_scope: ["KOSPI200", "005930", "000660"]
    consensus_source: "us_macro"
    consensus_field: "headline_mom"       # ② 사전 등록 — FF 제목 "CPI m/m" (헤드라인 m/m)
    consensus_unit: "%"
  US_NFP:
    label: "미 고용보고서(Employment Situation)"
    official_source: "https://www.bls.gov/schedule/news_release/empsit.htm"
    release_rule: "08:30 America/New_York (KST 21:30/22:30) — KRX 휴장 시간"
    tz: "America/New_York"
    local_time: "08:30"
    t0_mode: "A1_open"
    asset_scope: ["KOSPI200", "005930", "000660"]
    consensus_source: "us_macro"
    consensus_field: "headline_change"    # ② 사전 등록 — FF 제목 "Non-Farm Employment Change" (헤드라인 고용 증감)
    consensus_unit: "K"
  US_PCE:
    label: "미 PCE(Personal Income and Outlays)"
    official_source: "https://www.bea.gov/news/schedule"
    release_rule: "08:30 America/New_York (KST 21:30/22:30) — KRX 휴장 시간"
    tz: "America/New_York"
    local_time: "08:30"
    t0_mode: "A1_open"
    asset_scope: ["KOSPI200", "005930", "000660"]
    consensus_source: "us_macro"
    consensus_field: "core_mom"           # ② 사전 등록 — FF 제목 "Core PCE Price Index m/m" (코어 m/m)
    consensus_unit: "%"
  SEC_PRELIM:
    label: "삼성전자 잠정실적"
    official_source: "https://www.samsung.com/sec/ir/financial-information/earnings-release/ (+ DART 공시)"
    release_rule: "분기 익월 첫 주 ≈08:00 Asia/Seoul, 개장 전 — 정확한 날짜는 발표 수일 전 확정(수동 갱신)"
    tz: "Asia/Seoul"
    local_time: "08:00"
    t0_mode: "A1_open"
    asset_scope: ["005930", "KOSPI200"]
    consensus_source: "kr_earnings"   # 네이버금융(FnGuide 컨센서스) collectors/kr_earnings.py
    consensus_field: "분기 영업이익 컨센서스"
    consensus_unit: "억원"
    ticker: "005930"
  HYNIX_EARN:
    label: "SK하이닉스 실적"
    official_source: "https://www.skhynix.com/ir/ (+ DART 공시)"
    release_rule: "≈06:00~08:00 Asia/Seoul 공시, 컨콜 09:00, 개장 전 — 정확한 날짜는 발표 1~2주 전 확정(수동 갱신)"
    tz: "Asia/Seoul"
    local_time: "07:00"
    t0_mode: "A1_open"
    asset_scope: ["000660", "KOSPI200"]
    consensus_source: "kr_earnings"
    consensus_field: "분기 영업이익 컨센서스"
    consensus_unit: "억원"
    ticker: "000660"
  NVDA_EARN:
    label: "엔비디아 실적"
    official_source: "https://investor.nvidia.com/events-and-presentations/"
    release_rule: "≈13:20 America/Los_Angeles = 16:20 ET (KST 익일 05:20/06:20), 개장 전"
    tz: "America/New_York"
    local_time: "16:20"
    t0_mode: "A1_open"
    asset_scope: ["KOSPI200", "005930", "000660"]
    consensus_source: "nvda"          # yfinance Ticker.calendar / earnings_dates
    consensus_field: "EPS estimate (quarter)"
    consensus_unit: "USD"
    ticker: "NVDA"

